<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-primary-container": "#858383",
                        "outline": "#747878",
                        "inverse-surface": "#313030",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#e1e0ff",
                        "surface-container-highest": "#e5e2e1",
                        "secondary-container": "#6063ee",
                        "on-surface": "#1c1b1b",
                        "surface-tint": "#5f5e5e",
                        "surface-container-high": "#ebe7e6",
                        "surface-bright": "#fdf8f8",
                        "surface-dim": "#ddd9d8",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed": "#1c1b1a",
                        "on-primary-fixed": "#1c1b1b",
                        "on-surface-variant": "#444748",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#1c1b1a",
                        "on-background": "#1c1b1b",
                        "secondary": "#4648d4",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-tertiary-fixed-variant": "#484645",
                        "surface-container-low": "#f7f3f2",
                        "tertiary-fixed": "#e6e1df",
                        "primary-fixed": "#e5e2e1",
                        "outline-variant": "#c4c7c7",
                        "tertiary": "#000000",
                        "on-error": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "surface-container": "#f1edec",
                        "on-primary-fixed-variant": "#474646",
                        "surface": "#fdf8f8",
                        "inverse-on-surface": "#f4f0ef",
                        "primary-container": "#1c1b1b",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#868381",
                        "error": "#ba1a1a",
                        "background": "#fdf8f8",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-secondary-container": "#fffbff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#07006c",
                        "tertiary-fixed-dim": "#cac6c3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin": "40px",
                        "lg": "24px",
                        "md": "16px",
                        "unit": "4px",
                        "gutter": "20px",
                        "sm": "8px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fdf8f8;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex min-h-screen">
<!-- SideNavBar -->
<aside class="w-[240px] h-screen fixed left-0 top-0 bg-surface dark:bg-inverse-surface shadow-sm flex flex-col h-full py-xl px-md z-50">
<div class="mb-xl px-sm">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">TaskStream</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Productivity Workspace</p>
</div>
<nav class="flex-1 space-y-xs">
<a class="flex items-center gap-md px-md py-sm rounded transition-colors duration-150 hover:bg-surface-container-low dark:hover:bg-surface-container-highest text-on-surface-variant dark:text-on-surface-variant" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-body-md text-body-md">Dashboard</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded transition-colors duration-150 hover:bg-surface-container-low dark:hover:bg-surface-container-highest text-on-surface-variant dark:text-on-surface-variant" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="font-body-md text-body-md">Calendar</span>
</a>
<!-- Active State: Add Task -->
<a class="flex items-center gap-md px-md py-sm rounded text-primary dark:text-primary-fixed-dim font-bold border-r-2 border-primary dark:border-primary-fixed-dim bg-surface-container-low dark:bg-surface-container-highest transition-transform duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-body-md text-body-md">Add Task</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded transition-colors duration-150 hover:bg-surface-container-low dark:hover:bg-surface-container-highest text-on-surface-variant dark:text-on-surface-variant" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-body-md text-body-md">History</span>
</a>
<a class="flex items-center gap-md px-md py-sm rounded transition-colors duration-150 hover:bg-surface-container-low dark:hover:bg-surface-container-highest text-on-surface-variant dark:text-on-surface-variant" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-body-md text-body-md">Settings</span>
</a>
</nav>
<div class="mt-auto px-sm pt-xl border-t border-outline-variant">
<button class="w-full bg-primary text-on-primary py-md rounded-lg font-label-md text-label-md transition-all duration-150 active:opacity-80">
                New Project
            </button>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 ml-[240px]">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-xl py-md sticky top-0 z-40 bg-surface dark:bg-inverse-surface shadow-sm">
<div class="flex items-center gap-lg flex-1">
<div class="relative w-full max-w-md">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-[48px] pr-md py-sm bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-secondary text-label-md" placeholder="Search tasks..." type="text"/>
</div>
</div>
<div class="flex items-center gap-lg">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high p-sm rounded-full transition-all">notifications</button>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high p-sm rounded-full transition-all">help_outline</button>
<div class="w-xl h-xl rounded-full overflow-hidden border border-outline-variant">
<img alt="User avatar" data-alt="A clean professional headshot of a minimalist corporate user, soft studio lighting on a neutral grey background, high resolution, sharp focus, representing an efficient professional persona in a modern tech environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgBxAicQgp22q7tRUXKLQZA8rK55eqCfBv2sIKGAIqxh4AX6ZiqSM6Io4Vq4IojxkxyT4dFDXvGaHc2QFvfC2fPMYGUenv5QQhPcEAv_OcWVBgAHu_7OctZ-3G_CMC1DT8LFv2d438AuomOM3iCARfqZ7FRDn_pBOjzuX9RcWyKBYYAwAc5TgYdE7rjNy7SmFPb7__mr2Z62SWYoO7o_XHH6Uyc98IHQ6fSOTtRQajmFIOHCxXyi3ywJHeyHaCEGmn5pyI2AN3_fw"/>
</div>
</div>
</header>
<!-- Page Canvas -->
<div class="p-xl max-w-5xl mx-auto">
<div class="mb-xl">
<h2 class="font-headline-lg text-headline-lg text-primary">Create New Task</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Define your next milestone and stay organized.</p>
</div>
<!-- Main Form Container: Bento Style Layout -->
<div class="grid grid-cols-12 gap-lg">
<!-- Left Column: Primary Fields -->
<div class="col-span-12 lg:col-span-8 space-y-lg">
<div class="bg-surface-container-lowest border border-outline-variant p-xl rounded-xl shadow-sm">
<div class="space-y-xl">
<!-- Task Title -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="task-title">Task Title</label>
<input class="w-full bg-white border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-secondary focus:border-transparent font-body-md outline-none transition-all" id="task-title" placeholder="e.g., Finalize Q4 Marketing Strategy" type="text"/>
</div>
<!-- Description -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="description">Description</label>
<textarea class="w-full bg-white border border-outline-variant rounded-lg p-md focus:ring-2 focus:ring-secondary focus:border-transparent font-body-md outline-none transition-all resize-none" id="description" placeholder="Describe the objectives, key results, and any relevant links..." rows="6"></textarea>
</div>
</div>
</div>
</div>
<!-- Right Column: Metadata Fields -->
<div class="col-span-12 lg:col-span-4 space-y-lg">
<div class="bg-surface-container-lowest border border-outline-variant p-xl rounded-xl shadow-sm">
<div class="space-y-xl">
<!-- Due Date -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="due-date">Due Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_today</span>
<input class="w-full pl-[48px] pr-md py-md bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-transparent font-body-md outline-none transition-all" id="due-date" type="date"/>
</div>
</div>
<!-- Priority -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="priority">Priority</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">low_priority</span>
<select class="w-full pl-[48px] pr-md py-md bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-secondary focus:border-transparent font-body-md outline-none transition-all appearance-none" id="priority">
<option value="low">Low Priority</option>
<option selected="" value="medium">Medium Priority</option>
<option value="high">High Priority</option>
<option value="urgent">Urgent</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Project Tag -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm">Project</label>
<div class="flex flex-wrap gap-xs">
<span class="px-md py-xs bg-secondary-container/10 text-secondary rounded-full font-label-sm text-label-sm border border-secondary/20 cursor-pointer hover:bg-secondary-container/20">Marketing</span>
<span class="px-md py-xs bg-surface-container text-on-surface-variant rounded-full font-label-sm text-label-sm border border-outline-variant cursor-pointer hover:bg-surface-container-high">+ Add Tag</span>
</div>
</div>
</div>
</div>
<!-- Visual Context / Image -->
<div class="rounded-xl overflow-hidden border border-outline-variant shadow-sm aspect-square bg-surface-container relative group">
<img class="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-300" data-alt="A minimalist architectural workspace with a clean wooden desk, a sleek modern lamp, and a single notebook. The lighting is bright and natural from a large window, creating a serene and focused atmosphere. The color palette is dominated by soft whites, light woods, and deep black accents, embodying a disciplined and professional productivity environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYVtPOzwoAc-QzygI4dPt7ux04mVSC1emH_uuiomL91_p2fzqTjS9G2ul8RqehP40ZmdgaGehkEdsvkPSC-zlu6_en8_kWKGupPKYzkRtbdJ8g5ZM5mYdnjDoBpDH9kvjCNKLsDRS8waHhXLr5JFPqpz1Cvse5G_hcFZqyj7Ltdo7gMG8RGyjfVrs4D_pzmDKzo2peEWjqQD1d0arSvpo7A07S2WwK6i9QLXDIvw8S6YcdH84EuTFSAwfb-iQlM9fIbVpHlHlCaf0"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-md">
<span class="text-white font-label-md text-label-md">Workspace Inspiration</span>
</div>
</div>
</div>
<!-- Bottom Action Bar -->
<div class="col-span-12 flex justify-end items-center gap-md pt-lg">
<button class="px-xl py-md border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all duration-150 active:scale-95">
                        Cancel
                    </button>
<button class="px-xl py-md bg-primary text-on-primary rounded-lg font-label-md text-label-md shadow-sm hover:bg-primary/90 transition-all duration-150 active:scale-95">
                        Create Task
                    </button>
</div>
</div>
</div>
</main>
</body></html>
