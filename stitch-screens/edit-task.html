<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c0c1ff",
                        "on-primary-container": "#858383",
                        "outline": "#747878",
                        "inverse-surface": "#313030",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#e1e0ff",
                        "surface-container-highest": "#e5e2e1",
                        "secondary-container": "#6063ee",
                        "on-surface": "#1c1b1b",
                        "surface-tint": "#5f5e5e",
                        "surface-container-high": "#ebe7e6",
                        "surface-bright": "#fdf8f8",
                        "surface-dim": "#ddd9d8",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed": "#1c1b1a",
                        "on-primary-fixed": "#1c1b1b",
                        "on-surface-variant": "#444748",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#1c1b1a",
                        "on-background": "#1c1b1b",
                        "secondary": "#4648d4",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-tertiary-fixed-variant": "#484645",
                        "surface-container-low": "#f7f3f2",
                        "tertiary-fixed": "#e6e1df",
                        "primary-fixed": "#e5e2e1",
                        "outline-variant": "#c4c7c7",
                        "tertiary": "#000000",
                        "on-error": "#ffffff",
                        "surface-variant": "#e5e2e1",
                        "surface-container": "#f1edec",
                        "on-primary-fixed-variant": "#474646",
                        "surface": "#fdf8f8",
                        "inverse-on-surface": "#f4f0ef",
                        "primary-container": "#1c1b1b",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#868381",
                        "error": "#ba1a1a",
                        "background": "#fdf8f8",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-secondary-container": "#fffbff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#07006c",
                        "tertiary-fixed-dim": "#cac6c3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin": "40px",
                        "lg": "24px",
                        "md": "16px",
                        "unit": "4px",
                        "gutter": "20px",
                        "sm": "8px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdf8f8;
        }
    </style>
</head>
<body class="bg-background text-on-background">
<!-- Side Navigation Shell -->
<aside class="bg-surface dark:bg-inverse-surface shadow-sm w-[240px] h-screen fixed left-0 top-0 flex flex-col py-xl px-md z-50">
<div class="mb-xl px-sm">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">TaskStream</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Productivity Workspace</p>
</div>
<nav class="flex-1 space-y-xs">
<a class="flex items-center gap-md px-md py-sm font-body-md text-body-md text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span>Dashboard</span>
</a>
<a class="flex items-center gap-md px-md py-sm font-body-md text-body-md text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
<span>Calendar</span>
</a>
<a class="flex items-center gap-md px-md py-sm font-body-md text-body-md text-primary dark:text-primary-fixed-dim font-bold border-r-2 border-primary dark:border-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
<span>Add Task</span>
</a>
<a class="flex items-center gap-md px-md py-sm font-body-md text-body-md text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span>History</span>
</a>
<a class="flex items-center gap-md px-md py-sm font-body-md text-body-md text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-150 active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span>Settings</span>
</a>
</nav>
<div class="mt-auto px-sm pt-xl border-t border-outline-variant">
<button class="w-full bg-primary text-on-primary py-sm rounded px-md font-label-md flex items-center justify-center gap-sm active:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
                New Project
            </button>
</div>
</aside>
<!-- Top App Bar -->
<header class="bg-surface dark:bg-inverse-surface shadow-sm sticky top-0 z-40 flex justify-between items-center w-full px-xl py-md ml-[240px] max-w-[calc(100%-240px)]">
<div class="flex items-center gap-md bg-surface-container-low px-md py-sm rounded-lg w-full max-w-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
<input class="bg-transparent border-none focus:ring-0 text-label-md w-full" placeholder="Search workspace..." type="text"/>
</div>
<div class="flex items-center gap-lg">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high p-xs rounded transition-all" data-icon="notifications">notifications</button>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high p-xs rounded transition-all" data-icon="help_outline">help_outline</button>
</div>
<div class="h-8 w-8 rounded-full overflow-hidden border border-outline-variant">
<img alt="User avatar" class="h-full w-full object-cover" data-alt="A professional headshot of a workspace manager with a neutral, focused expression. The portrait is taken in a brightly lit modern office setting with soft bokeh background. High-quality corporate photography style, emphasizing a clean and organized light-mode UI aesthetic consistent with premium productivity software." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDU8Ga0tFau6ynZk0cKF6SCqwp_k70gXUTBb_7FUZyEvpvb1Bwo5Pv2Z-gc_jR6WLzSSo9-EBLH3F4rhpBeF_QomVVqAAOHDOU4PD1LfTbQRsGPHwC6v22gtJR1kQuM5tZJ4XIONleZWK1rEGFiodHVQF3EpG9Yn68jrXKogZYFQN7affBj5TjWX98iz-cpuYMNbkSC544V9sGpnHOFTUPoAsi-8JDrPDtRQ3I9ScXtR8V-ybXd29C8yAQpLP2yfZpoltAxR4ZzlEE"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="ml-[240px] p-xl max-w-4xl mx-auto">
<div class="flex flex-col gap-xl">
<!-- Header Section -->
<div class="flex items-center justify-between">
<div>
<nav class="flex items-center gap-xs text-on-surface-variant font-label-sm mb-xs">
<a class="hover:text-primary" href="#">Dashboard</a>
<span class="material-symbols-outlined text-[14px]" data-icon="chevron_right">chevron_right</span>
<span class="text-primary">Edit Task</span>
</nav>
<h2 class="font-headline-lg text-headline-lg text-primary">Edit Task Details</h2>
</div>
<button class="flex items-center gap-sm text-error font-label-md hover:bg-error-container/10 p-sm rounded transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
                    Delete Task
                </button>
</div>
<!-- Bento Form Layout -->
<div class="grid grid-cols-12 gap-lg">
<!-- Main Task Info Card -->
<div class="col-span-12 lg:col-span-8 bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-sm">
<form class="space-y-xl">
<div class="space-y-sm">
<label class="font-label-md text-primary block">Task Title</label>
<input class="w-full bg-surface border border-outline-variant rounded px-md py-sm focus:ring-2 focus:ring-secondary focus:border-transparent outline-none font-body-md" type="text" value="Q4 Financial Report Finalization"/>
</div>
<div class="space-y-sm">
<label class="font-label-md text-primary block">Description</label>
<textarea class="w-full bg-surface border border-outline-variant rounded px-md py-sm focus:ring-2 focus:ring-secondary focus:border-transparent outline-none font-body-md resize-none" rows="6">Complete the final review of the Q4 financial summaries including the balance sheet, cash flow statements, and income projections for the upcoming executive board meeting. Ensure all department leads have signed off on their respective sections.</textarea>
</div>
<div class="pt-lg flex items-center gap-md">
<button class="bg-primary text-on-primary font-label-md px-xl py-md rounded hover:bg-opacity-90 transition-all active:scale-95" type="submit">
                                Save Changes
                            </button>
<button class="bg-transparent border border-outline text-primary font-label-md px-xl py-md rounded hover:bg-surface-container-low transition-all active:scale-95" type="button">
                                Cancel
                            </button>
</div>
</form>
</div>
<!-- Task Metadata Sidebar -->
<div class="col-span-12 lg:col-span-4 flex flex-col gap-lg">
<!-- Status & Priority Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm flex flex-col gap-lg">
<div class="space-y-sm">
<label class="font-label-md text-primary block">Status</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded px-md py-sm focus:ring-2 focus:ring-secondary outline-none font-body-md">
<option>To Do</option>
<option selected="">In Progress</option>
<option>Review</option>
<option>Completed</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-primary block">Priority</label>
<div class="flex gap-sm">
<button class="flex-1 py-sm rounded border border-outline-variant font-label-sm flex items-center justify-center gap-xs hover:bg-surface-container-low" type="button">
<span class="w-2 h-2 rounded-full bg-green-500"></span> Low
                                </button>
<button class="flex-1 py-sm rounded border border-secondary bg-secondary-container/10 font-label-sm flex items-center justify-center gap-xs" type="button">
<span class="w-2 h-2 rounded-full bg-yellow-500"></span> Med
                                </button>
<button class="flex-1 py-sm rounded border border-outline-variant font-label-sm flex items-center justify-center gap-xs hover:bg-surface-container-low" type="button">
<span class="w-2 h-2 rounded-full bg-red-500"></span> High
                                </button>
</div>
</div>
</div>
<!-- Date & Assignment Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm flex flex-col gap-lg">
<div class="space-y-sm">
<label class="font-label-md text-primary block">Due Date</label>
<div class="flex items-center gap-md bg-surface border border-outline-variant rounded px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="calendar_today">calendar_today</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md" type="date" value="2023-12-15"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-primary block">Assignee</label>
<div class="flex items-center gap-md">
<div class="flex -space-x-2">
<div class="h-8 w-8 rounded-full border-2 border-white overflow-hidden">
<img class="h-full w-full object-cover" data-alt="A portrait of a cheerful female team member in a minimalist creative studio setting. The lighting is soft and natural, emphasizing a professional yet approachable corporate look. The image aligns with a high-end light-mode UI design, featuring neutral tones and sharp focus." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgrNGBAkQ8LBza_aJ5j84zpa_1nV9gEOkLBvdlug29M8wTJ2wccoB-zZ_vH7-Lhw8Rn7yF7GE1LhJCAabW2C1HgaT607ICVEPkyv69OHLKiqnqvs2mbDf-hZN20f14ZdLFpk2eTSa-8oiXVAg7AQ2QdAXoU8O3cl5PiF6LXT0KJTJHNpsRVBEvDBkN7N3QL5WRmPwME7icAkuz6k2AO5p4sQz_nH32hwW63y_pDBJLgoK_GLWtBThqTuslk5g0wKNCYr5GsXWEDMs"/>
</div>
<div class="h-8 w-8 rounded-full border-2 border-white bg-surface-container-high flex items-center justify-center text-label-sm">
                                        +2
                                    </div>
</div>
<button class="text-secondary font-label-sm hover:underline">Change</button>
</div>
</div>
</div>
<!-- Visual Project Context -->
<div class="bg-primary-container text-on-primary-container rounded-xl p-lg relative overflow-hidden h-32">
<div class="relative z-10 flex flex-col justify-between h-full">
<span class="font-label-sm uppercase tracking-wider opacity-80">Connected Project</span>
<span class="font-headline-sm">Annual Strategy 2024</span>
</div>
<div class="absolute -right-8 -bottom-8 opacity-10">
<span class="material-symbols-outlined text-[120px]" data-icon="analytics">analytics</span>
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
